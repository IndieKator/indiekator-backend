[project]
name = "indiekator-backend"
version = "0.1.0"
description = "IHSG Fear & Greed Index API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "supabase>=2.10.0",
    "pytrends-modern>=0.2.13",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "httpx>=0.28.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
indiekator = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
